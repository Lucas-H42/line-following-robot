[platformio]
src_dir = .
default_envs = robot_env, controller_env

[env:controller_env]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 9600
upload_protocol = dfu
build_src_filter = +<*> -<LineFollow_Robot/> -<.pio/> -<.git/>
lib_deps =
    RF24.h
    RF24_config.h
    nRF24L01.h
    printf.h

[env:robot_env]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 9600
upload_protocol = dfu
build_src_filter = +<*> -<LineFollow_Control/> -<.pio/> -<.git/>
lib_deps =
    TinyGPSPlus.h
    MPU6050_light.h>
    BMP180I2C.h
    RF24.h
    RF24_config.h
    nRF24L01.h
    printf.h