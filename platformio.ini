[platformio]
src_dir = .
default_envs = robot_env, controller_env

[env] ; The default env which both boards share
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 115200
upload_protocol = dfu
monitor_port = /dev/cu.usbmodem*
build_flags =
    -D USBCON
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; The individual settings for each board
[env:controller_env]
build_src_filter = +<*> -<LineFollow_Robot/> -<.pio/> -<.git/>
lib_deps =
    nrf24/RF24 @ ^1.4.11

[env:robot_env]
build_src_filter = +<*> -<LineFollow_Control/> -<.pio/> -<.git/>
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.1.0
    rfetick/MPU6050_light @ ^1.1.0
    https://github.com/christandlg/BMP180MI.git
    nrf24/RF24 @ ^1.4.11