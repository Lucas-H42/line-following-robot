[platformio]
src_dir = .
default_envs = robot_env, controller_env

[env:controller_env]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 115200
upload_protocol = dfu
build_src_filter = +<*> -<LineFollow_Robot/> -<.pio/> -<.git/>
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++20
lib_deps =
    nrf24/RF24 @ ^1.4.11

[env:robot_env]
platform = ststm32
board = genericSTM32F405RG
framework = arduino
monitor_speed = 115200
upload_protocol = dfu
build_src_filter = +<*> -<LineFollow_Control/> -<.pio/> -<.git/>
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++20
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.1.0
    rfetick/MPU6050_light @ ^1.1.0
    https://github.com/christandlg/BMP180MI.git
    nrf24/RF24 @ ^1.4.11
    # Leave out SoftwareSerial for now cause it clashes with C++20
    # plerup/EspSoftwareSerial @ ^8.2.0